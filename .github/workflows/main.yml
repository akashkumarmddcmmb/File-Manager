name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build File Manager Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      # 4. Check SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo "Android SDK:"
          sdkmanager --version

          echo "Installed packages:"
          sdkmanager --list_installed

      # 5. Setup Gradle 9.3.1
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      # 6. Verify project files
      - name: Verify Project Structure
        shell: bash
        run: |
          set -e

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "gradle/libs.versions.toml"
          test -f "gradle/wrapper/gradle-wrapper.properties"

          echo "Project structure OK."

      # 7. Check Gradle
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      # 8. Create debug keystore required by project
      - name: Create Debug Keystore
        shell: bash
        run: |
          set -e

          if [ ! -f "debug.keystore" ]; then
            keytool \
              -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          keytool \
            -list \
            -keystore debug.keystore \
            -storepass android

      # 9. Clean
      - name: Clean Project
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      # 10. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # 11. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Available build outputs:"
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: File-manager-1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 13. Upload build outputs if anything fails
      - name: Upload Build Outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: File-manager-1-Build-Outputs
          path: app/build/outputs/
          if-no-files-found: warn
          retention-days: 14
