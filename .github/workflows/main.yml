name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build File Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Executable
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Verify Project
        shell: bash
        run: |
          set -e

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"

          echo "Project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug \
              --no-daemon \
              --stacktrace
          else
            gradle :app:assembleDebug \
              --no-daemon \
              --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "======================================"
          echo "APK BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh "$APK"

          sha256sum "$APK" > "$APK.sha256"

          cat "$APK.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "File Manager Build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
