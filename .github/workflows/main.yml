name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    name: Build File Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Android SDK:"
          sdkmanager --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

      - name: Find Android Gradle Project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle Wrapper..."

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 4 -type f \
              -not -path "./.git/*" \
              -print | sort
            exit 1
          fi

          GRADLE_DIR=$(dirname "$GRADLEW")

          echo "Gradle Wrapper found:"
          echo "$GRADLEW"

          echo "Gradle project directory:"
          echo "$GRADLE_DIR"

          echo "$GRADLE_DIR" > "$GITHUB_WORKSPACE/.gradle-project-dir"

          chmod +x "$GRADLEW"

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(cat "$GITHUB_WORKSPACE/.gradle-project-dir")

          cd "$GRADLE_DIR"

          ./gradlew --version

      - name: Show Android Project
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(cat "$GITHUB_WORKSPACE/.gradle-project-dir")

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "Gradle Project"
          echo "======================================"

          pwd

          echo ""
          echo "Settings:"
          ls -la settings.gradle* 2>/dev/null || true

          echo ""
          echo "Build files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print | sort

      - name: Clean Project
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(cat "$GITHUB_WORKSPACE/.gradle-project-dir")

          cd "$GRADLE_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          GRADLE_DIR=$(cat "$GITHUB_WORKSPACE/.gradle-project-dir")

          cd "$GRADLE_DIR"

          echo "======================================"
          echo "Building Debug APK"
          echo "======================================"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK"
          echo "======================================"

          APK=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -not -path "*/.git/*" \
            -print | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK was generated."
            echo ""
            echo "Build directories:"
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "outputs" \
              -print || true

            echo ""
            echo "Gradle build files:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name "*.gradle" -o -name "*.gradle.kts" \) \
              -not -path "*/.git/*" \
              -print | sort

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "$APK" > "$GITHUB_WORKSPACE/.apk-path"

          ls -lh "$APK"

      - name: Verify APK SHA-256
        shell: bash
        run: |
          set -e

          APK=$(cat "$GITHUB_WORKSPACE/.apk-path")

          echo "======================================"
          echo "APK SHA-256"
          echo "======================================"

          sha256sum "$APK"

          sha256sum "$APK" > "$APK.sha256"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-Debug-APK
          path: |
            **/*.apk
            **/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-Build-Outputs
          path: |
            **/build/outputs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "File Manager Build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            **/*.apk
            **/*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
