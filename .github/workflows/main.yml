name: Build Android APK

on:
push:
branches:
- main
- master
workflow_dispatch:

permissions:
contents: read
id-token: write
attestations: write

env:
FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
build-apk:
name: Build File Manager Debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v7

  - name: Setup JDK 17
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Android SDK
    uses: android-actions/setup-android@v4
    with:
      packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

  - name: Verify Android SDK
    shell: bash
    run: |
      set -e
      echo "Java:"
      java -version
      echo "Android SDK:"
      sdkmanager --version
      echo "Installed packages:"
      sdkmanager --list_installed

  - name: Setup Gradle 9.3.1
    uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: "9.3.1"

  - name: Verify Project Structure
    shell: bash
    run: |
      set -e
      test -f "settings.gradle.kts"
      test -f "build.gradle.kts"
      test -f "app/build.gradle.kts"
      test -f "gradle/libs.versions.toml"
      test -f "gradle/wrapper/gradle-wrapper.properties"
      echo "Project structure OK."

  - name: Verify Gradle
    shell: bash
    run: |
      set -e
      gradle --version

  - name: Create Debug Keystore
    shell: bash
    run: |
      set -e

      if [ ! -f "debug.keystore" ]; then
        keytool \
          -genkeypair \
          -v \
          -keystore debug.keystore \
          -storepass android \
          -alias androiddebugkey \
          -keypass android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"
      fi

      keytool \
        -list \
        -keystore debug.keystore \
        -storepass android

  - name: Clean Project
    shell: bash
    run: |
      set -e
      gradle clean \
        --no-daemon \
        --stacktrace

  - name: Build Debug APK
    shell: bash
    run: |
      set -e

      gradle :app:assembleDebug \
        --no-daemon \
        --stacktrace \
        --warning-mode all

  - name: Verify APK
    shell: bash
    run: |
      set -e

      APK="app/build/outputs/apk/debug/app-debug.apk"

      if [ ! -f "$APK" ]; then
        echo "ERROR: APK was not generated."
        echo "Available build outputs:"
        find app/build/outputs -type f -print || true
        exit 1
      fi

      echo "======================================"
      echo "APK BUILD SUCCESSFUL"
      echo "======================================"

      ls -lh "$APK"

      echo "APK SHA-256:"
      sha256sum "$APK"

  - name: Create APK SHA-256 Checksum
    shell: bash
    run: |
      set -e

      APK="app/build/outputs/apk/debug/app-debug.apk"
      CHECKSUM="app/build/outputs/apk/debug/app-debug.apk.sha256"

      sha256sum "$APK" > "$CHECKSUM"

      echo "======================================"
      echo "APK CHECKSUM"
      echo "======================================"

      cat "$CHECKSUM"

  - name: Attest APK Build
    uses: actions/attest-build-provenance@v3
    with:
      subject-path: app/build/outputs/apk/debug/app-debug.apk

  - name: Upload Safe Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: File-manager-1-Safe-Debug-APK
      path: |
        app/build/outputs/apk/debug/app-debug.apk
        app/build/outputs/apk/debug/app-debug.apk.sha256
      if-no-files-found: error
      retention-days: 30

  - name: Upload Build Outputs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: File-manager-1-Build-Outputs
      path: app/build/outputs/
      if-no-files-found: warn
      retention-days: 14
