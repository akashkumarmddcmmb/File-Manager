name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Security Audits & Secret Scanning
      # ==========================================================
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vulnerability Scanner (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      # ==========================================================
      # 3. Java 17
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================================
      # 4. Android SDK
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================================
      # 5. Install Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ==========================================================
      # 6. Secure Environment Variables Injection
      # ==========================================================
      - name: Secure Environment Variables Injection (.env)
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "Environment configuration ready."

      # ==========================================================
      # 7. Make Gradle Wrapper Executable
      # ==========================================================
      - name: Make Gradle Wrapper Executable
        shell: bash
        run: chmod +x gradlew

      # ==========================================================
      # 8. Clean Project
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euxo pipefail
          ./gradlew clean --no-daemon --no-configuration-cache --stacktrace

      # ==========================================================
      # 9. Build Debug APK
      # ==========================================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -euxo pipefail
          echo "=================================================="
          echo "RUNNING GRADLE BUILD WITH WRAPPER"
          echo "=================================================="

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all

      # ==========================================================
      # 10. Find APK
      # ==========================================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 11. Generate SHA256 checksum & Build Info
      # ==========================================================
      - name: Generate Checksum and Info
        shell: bash
        run: |
          set -euxo pipefail
          APK="${{ steps.apk.outputs.apk_path }}"
          sha256sum "$APK" > "${APK}.sha256"

          mkdir -p build-info
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run Number: $GITHUB_RUN_NUMBER"
            echo "APK SHA256:"
            cat "${APK}.sha256"
          } > build-info/build-info.txt

      # ==========================================================
      # 12. Upload APK Artifact
      # ==========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-debug-apk-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.apk_path }}.sha256
            build-info/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 13. Prepare GitHub Release
      # ==========================================================
      - name: Prepare release package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" "release/File-Manager-${{ github.run_number }}.apk"
          cp "${{ steps.apk.outputs.apk_path }}.sha256" "release/File-Manager-${{ github.run_number }}.apk.sha256"
          cp build-info/build-info.txt release/build-info.txt

      # ==========================================================
      # 14. GitHub Release
      # ==========================================================
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "File Manager Build ${{ github.run_number }}"
          generate_release_notes: true
          prerelease: false
          files: |
            release/File-Manager-${{ github.run_number }}.apk
            release/File-Manager-${{ github.run_number }}.apk.sha256
            release/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
