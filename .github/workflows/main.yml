name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  build-apk:
    name: Build File Manager APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

          echo ""
          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"
          sdkmanager --version

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

      - name: Verify Project Structure
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PROJECT STRUCTURE"
          echo "======================================"

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "gradle/wrapper/gradle-wrapper.properties"

          echo "settings.gradle.kts ........ OK"
          echo "build.gradle.kts ........... OK"
          echo "app/build.gradle.kts ....... OK"
          echo "gradle-wrapper.properties .. OK"

      - name: Detect Gradle Version
        id: gradle_version
        shell: bash
        run: |
          set -e

          FILE="gradle/wrapper/gradle-wrapper.properties"

          DISTRIBUTION_URL=$(grep '^distributionUrl=' "$FILE" | sed 's/^distributionUrl=//')

          if [ -z "$DISTRIBUTION_URL" ]; then
            echo "ERROR: distributionUrl was not found."
            cat "$FILE"
            exit 1
          fi

          echo "Gradle distribution:"
          echo "$DISTRIBUTION_URL"

          VERSION=$(echo "$DISTRIBUTION_URL" | sed -n 's/.*gradle-\([0-9][0-9.]*\)-.*/\1/p')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not detect Gradle version."
            exit 1
          fi

          echo "Detected Gradle version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Project Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gradle_version.outputs.version }}

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "GRADLE"
          echo "======================================"

          gradle --version

      - name: Clean Project
        shell: bash
        run: |
          set -e

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILDING DEBUG APK"
          echo "======================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find Generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK=$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build/outputs \
              -type f \
              -print || true

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "$APK" > "$GITHUB_WORKSPACE/.apk-path"

          ls -lh "$APK"

      - name: Generate SHA-256
        shell: bash
        run: |
          set -e

          APK=$(cat "$GITHUB_WORKSPACE/.apk-path")

          sha256sum "$APK" > "$APK.sha256"

          echo "======================================"
          echo "APK SHA-256"
          echo "======================================"

          cat "$APK.sha256"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-Debug-APK
          path: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: File-Manager-Build-Outputs
          path: app/build/outputs/
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "File Manager Build ${{ github.run_number }}"
          generate_release_notes: true
          files: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
