name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout Repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Security Audits & Secret Scanning
      # ==========================================================
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Vulnerability Scanner (Trivy)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ==========================================================
      # 3. Java 17 Setup
      # ==========================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================================
      # 4. Setup Gradle 9.3.1
      # ==========================================================
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      # ==========================================================
      # 5. Android SDK Setup
      # ==========================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================================
      # 6. Install Android SDK packages
      # ==========================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ==========================================================
      # 7. Secure Environment Variables Injection (.env)
      # ==========================================================
      - name: Secure Environment Variables Injection (.env)
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "GEMINI_API_KEY=${{ secrets.GITHUB_TOKEN }}" >> .env
          echo "Environment configuration ready."

      # ==========================================================
      # 8. Absolute Fix for Debug Keystore Signing Error
      # ==========================================================
      - name: Generate Debug Keystore
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.android
          mkdir -p app

          # Forigi iujn ajn ekzistantajn dosierojn por eviti konfliktojn
          rm -f app/debug.keystore
          rm -f ~/.android/debug.keystore

          # Krei novan puran debug.keystore
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # Kopii al la sistema dosierujo
          cp app/debug.keystore ~/.android/debug.keystore
          echo "Keystore sukcese kreita kaj kopiita al app/ kaj ~/.android/"

      # ==========================================================
      # 9. Setup Build Executable
      # ==========================================================
      - name: Setup Build Executable
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            echo "GRADLE_CMD=gradle" >> $GITHUB_ENV
          fi

      # ==========================================================
      # 10. Clean Project
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -euxo pipefail
          $GRADLE_CMD clean --no-daemon --no-configuration-cache --stacktrace

      # ==========================================================
      # 11. Build Debug APK
      # ==========================================================
      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
        shell: bash
        run: |
          set -euxo pipefail
          echo "=================================================="
          echo "RUNNING GRADLE BUILD WITH $GRADLE_CMD"
          echo "=================================================="

          $GRADLE_CMD :app:assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode=all

      # ==========================================================
      # 12. Locate Generated APK
      # ==========================================================
      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find app/build/outputs -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 13. Generate SHA256 Checksum & Build Info
      # ==========================================================
      - name: Generate Checksum and Info
        shell: bash
        run: |
          set -euxo pipefail
          APK="${{ steps.apk.outputs.apk_path }}"
          sha256sum "$APK" > "${APK}.sha256"

          mkdir -p build-info
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run Number: $GITHUB_RUN_NUMBER"
            echo "APK SHA256:"
            cat "${APK}.sha256"
          } > build-info/build-info.txt

      # ==========================================================
      # 14. Upload APK Artifact
      # ==========================================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-manager-debug-apk-${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.apk_path }}
            ${{ steps.apk.outputs.apk_path }}.sha256
            build-info/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ==========================================================
      # 15. Prepare Release Package
      # ==========================================================
      - name: Prepare release package
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release
          cp "${{ steps.apk.outputs.apk_path }}" "release/File-Manager-${{ github.run_number }}.apk"
          cp "${{ steps.apk.outputs.apk_path }}.sha256" "release/File-Manager-${{ github.run_number }}.apk.sha256"
          cp build-info/build-info.txt release/build-info.txt

      # ==========================================================
      # 16. Create GitHub Release
      # ==========================================================
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "File Manager Build ${{ github.run_number }}"
          generate_release_notes: true
          prerelease: false
          files: |
            release/File-Manager-${{ github.run_number }}.apk
            release/File-Manager-${{ github.run_number }}.apk.sha256
            release/build-info.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
